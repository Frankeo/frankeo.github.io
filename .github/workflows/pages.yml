name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate JavaScript and CV behavior
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5.0.0
      - name: Stage public site only
        run: |
          mkdir _site
          cp index.html styles.css app.js cv.js drive.js cv.json _site/
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5
